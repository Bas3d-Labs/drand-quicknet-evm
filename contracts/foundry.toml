[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc = "0.8.36"
optimizer = true
optimizer_runs = 200
via_ir = false

fs_permissions = [
    { access = "read", path = "../deployments" },
    { access = "read", path = "test/fixtures/quicknet-kat.json" }
]

[fmt]
line_length = 80
tab_width = 4
multiline_func_header = "all"
single_line_statement_blocks = "multi"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
